<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftPulse · Live Split-Screen Evaluation Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0C1210;
      --bar-bg: #111A16;
      --line: #273630;
      --royal-emerald: #0A3D2E;
      --royal-gold: #E5B83B;
      --ink: #F4EFE6;
      --ink-muted: #A1B2AA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header.control-bar {
      height: 58px;
      background: var(--bar-bg);
      border-bottom: 1.5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      gap: 12px;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-family: 'Fraunces', serif;
      font-size: 19px;
      color: var(--royal-gold);
      letter-spacing: -0.3px;
    }
    .brand-badge {
      background: rgba(229, 184, 59, 0.15);
      border: 1px solid var(--royal-gold);
      color: var(--royal-gold);
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #3DB88F;
      font-weight: 600;
      background: rgba(61, 184, 143, 0.12);
      border: 1px solid rgba(61, 184, 143, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3DB88F;
      box-shadow: 0 0 8px #3DB88F;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 0;
    }
    .btn-gold {
      background: var(--royal-gold);
      color: #06261D;
    }
    .btn-gold:hover {
      background: #ffd566;
      transform: translateY(-1px);
    }
    .btn-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--royal-gold);
    }
    .split-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 58px);
      position: relative;
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      min-width: 0;
    }
    .pane-header {
      height: 36px;
      background: #141D1A;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
    }
    .pane-header.customer-h {
      border-top: 3px solid #3DB88F;
      color: #3DB88F;
    }
    .pane-header.maker-h {
      border-top: 3px solid var(--royal-gold);
      color: var(--royal-gold);
    }
    .pane-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: #F8F5EE;
    }
    .divider {
      width: 6px;
      background: #060908;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      cursor: col-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .divider::after {
      content: '⋮';
      color: var(--ink-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="control-bar">
    <div class="brand-section">
      <span class="brand-title">CraftPulse</span>
      <span class="brand-badge">Split Studio</span>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>Dual Real-Time Sync Active</span>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-gold" onclick="triggerDemoOrder()" title="Simulate a customer request on the left that appears instantly on the right">
        ⚡ 1-Click Order (Left ➔ Right)
      </button>
      <button class="btn btn-outline" onclick="triggerAcceptOrder()" title="Artisan accepts order on right and advances customer timeline on left">
        🔨 Accept Order (Right ➔ Left)
      </button>
      <button class="btn btn-outline" onclick="triggerPorterDelivery()" title="Advance Porter courier delivery step">
        🚚 Dispatch Courier
      </button>
      <button class="btn btn-outline" onclick="open2DMap()" title="Scroll to interactive 2D neighborhood map in customer portal">
        🗺️ 2D Map
      </button>
      <button class="btn btn-outline" onclick="reloadFrames()" title="Reload both portal views">
        🔄 Refresh Both
      </button>
      <button class="btn btn-outline" onclick="openSeparateWindows()" title="Pop open into two separate Windows side-by-side">
        🖥️ Open 2 Windows
      </button>
    </div>
  </header>

  <main class="split-container" id="split-box">
    <!-- LEFT PANE: CUSTOMER -->
    <section class="pane" id="left-pane">
      <div class="pane-header customer-h">
        <div style="display:flex;align-items:center;gap:8px;">
          <span>👤 CUSTOMER PORTAL</span>
          <select id="cust-select" onchange="switchCustomer(this.value)" style="background:#0D1714; color:#3DB88F; border:1px solid rgba(61,184,143,0.4); border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; cursor:pointer;">
            <option value="user_dheep" selected>👤 Dheepsharan (Patron)</option>
            <option value="user_priya">🧑 Priya Raman (Customer)</option>
          </select>
        </div>
        <button class="btn btn-outline" style="padding:2px 8px;font-size:10px;" onclick="document.getElementById('frame-cust').contentWindow.location.reload()">Reload</button>
      </div>
      <iframe id="frame-cust" class="pane-frame" src="laptop.html?role=customer&split=left"></iframe>
    </section>

    <div class="divider" id="divider"></div>

    <!-- RIGHT PANE: ARTISAN / MAKER -->
    <section class="pane" id="right-pane">
      <div class="pane-header maker-h">
        <div style="display:flex;align-items:center;gap:8px;">
          <span>🛠️ ARTISAN WORKBENCH</span>
          <select id="atelier-select" onchange="switchMakerAtelier(this.value)" style="background:#0D1714; color:#E5C378; border:1px solid rgba(229,195,120,0.4); border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; cursor:pointer;">
            <option value="user_footshop" selected>👟 Footshop & Sneaker Studio (Vikram)</option>
            <option value="user_asha">🧵 Heritage Silks & Tailoring (Asha)</option>
            <option value="user_cakehouse">🍰 Cake House & Bake Atelier (Meera)</option>
            <option value="user_clay">🏺 Clay & Kiln Pottery (Kavitha)</option>
            <option value="user_aura">💍 Aura Heritage Silver Works (Deepak)</option>
            <option value="user_woodcraft">🪵 Rajan Master Woodcraft (Rajan)</option>
          </select>
        </div>
        <button class="btn btn-outline" style="padding:2px 8px;font-size:10px;" onclick="document.getElementById('frame-maker').contentWindow.location.reload()">Reload</button>
      </div>
      <iframe id="frame-maker" class="pane-frame" src="laptop.html?role=maker&split=right"></iframe>
    </section>
  </main>

  <script>
    function reloadFrames() {
      document.getElementById('frame-cust').contentWindow.location.reload();
      document.getElementById('frame-maker').contentWindow.location.reload();
    }

    function switchCustomer(userId) {
      const frame = document.getElementById('frame-cust');
      frame.src = 'laptop.html?role=customer&user=' + encodeURIComponent(userId) + '&split=left';
    }

    function switchMakerAtelier(userId) {
      const frame = document.getElementById('frame-maker');
      frame.src = 'laptop.html?role=maker&user=' + encodeURIComponent(userId) + '&split=right';
    }

    function openSeparateWindows() {
      const custUser = document.getElementById('cust-select').value;
      const makerUser = document.getElementById('atelier-select').value;
      window.open('laptop.html?role=customer&user=' + encodeURIComponent(custUser), 'CraftPulseCustomer', 'width=750,height=900,left=50,top=50');
      window.open('laptop.html?role=maker&user=' + encodeURIComponent(makerUser), 'CraftPulseMaker', 'width=750,height=900,left=820,top=50');
    }

    function open2DMap() {
      const fc = document.getElementById('frame-cust').contentWindow;
      if (fc && fc.scrollToMap) {
        fc.scrollToMap();
      }
    }

    // Direct synchronous simulation actions for judges
    function triggerDemoOrder() {
      try {
        const fc = document.getElementById('frame-cust').contentWindow;
        if (fc && fc.db) {
          const newOrder = {
            id: 'ord-' + Math.floor(1000 + Math.random() * 9000),
            customerId: 'user_dheep',
            customerName: 'Dheepsharan',
            makerId: 'footshop',
            service: 'Custom Sneaker Restoration & Resole',
            amount: 850,
            status: 'Requested',
            note: 'Navy leather with gold accents. Porter delivery upon completion.',
            createdAt: new Date().toISOString(),
            paymentStatus: 'Paid',
            paymentMethod: 'UPI (Google Pay)',
            approxTiming: 'Approx. 2–3 hrs',
            delivery: {
              type: 'home',
              status: 'Ready for Dispatch',
              partner: 'Porter Hyperlocal Express',
              trackingId: 'PRTR-BLR-' + Math.floor(100000 + Math.random() * 900000),
              fee: 55,
              distanceKm: 0.8,
              estimatedMinutes: 25,
              estimatedTimeLabel: '20 – 30 mins',
              pickupAddress: 'Footshop & Simplicity Sneaker Studio, Indiranagar',
              dropoffAddress: '12, 4th Cross, 12th Main, HAL 2nd Stage, Indiranagar, Bengaluru - 560038',
              driverName: 'Ramesh K. (Porter Rider)',
              driverPhone: '+91 98450 77123'
            }
          };
          fc.db.orders.unshift(newOrder);
          fc.saveDatabase(fc.db);
          fc.navigate('orders');
          fc.showToast('Test order #' + newOrder.id + ' broadcast to Maker on the right!');
        }
      } catch (err) {
        console.error(err);
      }
    }

    function triggerAcceptOrder() {
      try {
        const fm = document.getElementById('frame-maker').contentWindow;
        if (fm && fm.db) {
          const user = fm.currentUser ? fm.currentUser() : null;
          const targetMakerId = user?.makerId || 'footshop';
          const order = fm.db.orders.find(o => o.makerId === targetMakerId && o.status === 'Requested')
                     || fm.db.orders.find(o => o.status === 'Requested')
                     || fm.db.orders[0];
          if (order) {
            order.status = 'In progress';
            order.startedAt = Date.now();
            fm.saveDatabase(fm.db);
            fm.renderCurrentPage();
            fm.showToast('Order #' + order.id + ' accepted on workbench! Customer tracker updated.');
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    function triggerPorterDelivery() {
      try {
        const fc = document.getElementById('frame-cust').contentWindow;
        if (fc && fc.db) {
          const order = fc.db.orders.find(o => o.delivery);
          if (order) {
            fc.advanceDelivery(order.id);
          }
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
